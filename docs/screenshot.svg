    <rect x="224" y="284" width="404" height="26" rx="5" fill="#DBEAFE"/>
    <text x="234" y="302" fill="#1E293B">Sec_16   21.19 mm³</text>
    <text x="234" y="332" fill="#64748B">Sec_73   14.13 mm³</text>
    <text x="234" y="362" fill="#64748B">Sec_22   14.13 mm³</text>
    <text x="234" y="392" fill="#64748B">Sec_77   21.19 mm³</text>
    <text x="234" y="422" fill="#64748B">Sec_78   14.13 mm³</text>
    <text x="234" y="452" fill="#64748B">Sec_79   21.19 mm³</text>
    <text x="234" y="482" fill="#64748B">Sec_81   14.13 mm³</text>
