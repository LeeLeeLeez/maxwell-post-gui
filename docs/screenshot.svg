    <rect x="18" y="354" width="176" height="40" rx="8" fill="#FFFFFF"/>
    <text x="32" y="379" fill="#64748B">电流密度场图</text>

    <rect x="18" y="400" width="176" height="40" rx="8" fill="#FFFFFF"/>
