  <text x="230" y="640" font-size="12" fill="#94A3B8">已选 2 / 8  ·  双击加入堆栈  ·  支持通配过滤 Sec_7*</text>

  <!-- log -->
  <rect x="660" y="212" width="602" height="448" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="676" y="240" font-size="16" font-weight="bold" fill="#1E293B">日志</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#64748B">
    <text x="676" y="274">[10:21:03] 连接 AEDT … OK</text>
    <text x="676" y="302">[10:21:04] 当前设计: termination_edit</text>
    <text x="676" y="330">[10:21:05] 剖面 ZX → Sec_74_Sec (Non-model)</text>
    <text x="676" y="358">[10:21:09] 场计算器: Integrate(Surface(..), AtPhase(..))</text>
    <text x="676" y="386">[10:21:12] 报表 I_Sec_74 已创建 (X = Phase)</text>
    <text x="676" y="414">[10:21:13] 完成 ✅  8/8</text>
  </g>
  <text x="676" y="640" font-size="12" fill="#94A3B8">所有几何操作一律 Non-model，不会清空 &lt;proj&gt;.aedtresults/&lt;design&gt;.results/</text>

  <!-- status bar -->
  <line x1="0" y1="675.5" x2="1280" y2="675.5" stroke="#E2E8F0"/>
  <rect x="0" y="676" width="1280" height="44" fill="#FFFFFF"/>
  <text x="18" y="703" font-size="13" fill="#64748B">就绪   ·   只操作当前激活设计   ·   保存前后比对结果目录指纹，异常拒绝保存</text>
