    <rect x="18" y="446" width="176" height="40" rx="8" fill="#FFFFFF"/>
    <text x="32" y="471" fill="#64748B">matrix等效</text>
  </g>

  <!-- header card -->
  <rect x="214" y="78" width="1048" height="122" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="230" y="110" font-size="20" font-weight="bold" fill="#1E293B">电流积分</text>
  <text x="230" y="140" font-size="14" fill="#64748B">① 剖面 (Non-model)  →  ② 场计算器电流积分  →  ③ Maxwell 报表 (X = Phase)</text>
  <rect x="230" y="158" width="140" height="30" rx="6" fill="#2563EB"/>
  <text x="300" y="178" font-size="14" fill="#FFFFFF" text-anchor="middle">一条龙执行</text>
  <rect x="386" y="158" width="100" height="30" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="436" y="178" font-size="14" fill="#64748B" text-anchor="middle">仅补报表</text>
  <text x="520" y="178" font-size="13" fill="#94A3B8">坐标系列表 · 剖面平面 ZX · 相位 0~360° · 结果写回 Maxwell</text>

  <!-- entity list -->
  <rect x="214" y="212" width="430" height="448" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="230" y="240" font-size="16" font-weight="bold" fill="#1E293B">候选实体（copper）</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <rect x="224" y="254" width="404" height="26" rx="5" fill="#DBEAFE"/>
