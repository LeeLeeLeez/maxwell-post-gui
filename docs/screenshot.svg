<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Microsoft YaHei, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1280" height="720" fill="#F5F7FA"/>

  <!-- title bar -->
  <rect x="0" y="0" width="1280" height="56" fill="#FFFFFF"/>
